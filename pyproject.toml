[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msp-ai-agent"
version = "1.3.0"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.1",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.0",
  "pypdf>=4.2.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "python-pptx>=0.6.23",
  "pillow>=10.4.0",
  "pytesseract>=0.3.10",
  "numpy>=1.26.4"
]

[project.scripts]
msp-agent = "msp_agent.launcher:main"
msp-agent-gui = "msp_agent.gui:main"
msp-agent-cli = "msp_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
