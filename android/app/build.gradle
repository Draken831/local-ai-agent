plugins { id 'com.android.application' }

android {
    namespace 'com.nsu.mspagent'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nsu.mspagent'
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName '1.3.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
